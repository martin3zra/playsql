name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  integration:
    name: integration (postgres/mysql/sqlserver)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: playsql
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: playsql
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psecret"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Playsql_Test_123"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Playsql_Test_123 -No -Q 'SELECT 1' || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      PLAYSQL_POSTGRES_DSN: "postgres://postgres:secret@localhost:5432/playsql?sslmode=disable"
      PLAYSQL_MYSQL_DSN: "root:secret@tcp(localhost:3306)/playsql?parseTime=true"
      PLAYSQL_MSSQL_DSN: "sqlserver://sa:Playsql_Test_123@localhost:1433?database=master&encrypt=disable&TrustServerCertificate=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -tags integration -run TestIntegration -v ./...
