# Live databases for the integration suite (go test -tags integration).
# Bring up with `make db-up`, tear down with `make db-down`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: playsql
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: playsql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playsql"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: playsql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 3s
      timeout: 3s
      retries: 20

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Playsql_Test_123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Playsql_Test_123 -No -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
